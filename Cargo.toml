[package]
name = "shrike"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "AT Protocol library for Rust"
repository = "https://github.com/jcalabro/shrike"
homepage = "https://github.com/jcalabro/shrike"
documentation = "https://docs.rs/shrike"
authors = ["Jim Calabro <jamesrcalabro@gmail.com>"]
keywords = ["atproto", "bluesky", "at-protocol"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.92"

[package.metadata.docs.rs]
all-features = true

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
resolver = "2"
members = [
    ".",
    "wasm",
    "tools/lexgen",
    "tools/shrike",  # CLI tool (binary name: shrike)
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcalabro/shrike"
homepage = "https://github.com/jcalabro/shrike"
documentation = "https://docs.rs/shrike"
authors = ["Jim Calabro <jim@calabro.io>"]
keywords = ["atproto", "bluesky", "at-protocol", "distributed"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.92"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the jetstream live parser inspect a commit record's raw JSON
# text (duplicate-key rejection) without a second full parse of the frame.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
data-encoding = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }
bs58 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = "1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures = "0.3"
axum = "0.8"
http = "1"
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.9"
url = "2"
async-trait = "0.1"
hickory-resolver = "0.25"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"

[lints]
workspace = true

[features]
default = ["syntax", "cbor", "crypto", "mst", "repo", "car"]

# Foundation (no inter-module deps)
syntax = ["dep:js-sys"]
cbor = ["dep:simdutf8", "dep:bumpalo"]
crypto = ["dep:p256", "dep:k256", "dep:bs58", "dep:rand_core", "dep:zeroize", "dep:getrandom-02"]

# Layer 1 (depend on foundation)
car = ["cbor"]
mst = ["cbor"]
lexicon = ["syntax"]
xrpc = ["syntax", "dep:reqwest", "dep:tokio", "dep:gloo-timers"]
xrpc-server = ["syntax", "dep:tokio", "dep:axum", "dep:http"]

# Layer 2 (depend on lower layers)
repo = ["syntax", "cbor", "crypto", "mst"]
identity = ["syntax", "crypto", "dep:reqwest", "dep:tokio", "dep:hickory-resolver"]
labeling = ["syntax", "cbor", "crypto"]
streaming = ["syntax", "cbor", "car", "dep:tokio", "dep:tokio-tungstenite", "dep:futures", "dep:url", "dep:rand", "dep:gloo-net", "dep:gloo-timers", "dep:getrandom-03"]
api = ["syntax", "cbor", "xrpc"]

# Layer 3 (depend on multiple lower layers)
oauth = ["syntax", "crypto", "identity", "dep:reqwest", "dep:tokio", "dep:url", "dep:rand", "dep:async-trait", "dep:getrandom-03"]
sync = ["syntax", "cbor", "crypto", "mst", "repo", "car", "identity", "xrpc", "dep:tokio", "dep:async-trait"]
backfill = ["syntax", "sync", "xrpc", "dep:tokio", "dep:tokio-util", "dep:rand", "dep:futures"]

# Jetstream v2 replay/live client. Deliberately separate from the legacy
# `streaming` Jetstream client, which is left untouched. Dependencies are added
# per milestone as they come into use; M0 covers the portable segment codec
# (zstd on native, ruzstd on wasm, xxh3 checksums via twox-hash), M1 adds the
# protocol value model (`bytes` record backing, `jiff` RFC-3339 <-> micros), M4
# adds the live WebSocket transport (`tokio-tungstenite` native, `gloo-net`
# browser, `url` for wire-URL construction), M6 adds the browser archive HTTP
# transport (`gloo-net`'s `http` `fetch` wrapper plus `web-sys`/`wasm-bindgen`
# for incremental `ReadableStream` body reads) — all already resolved in the tree
# via `gloo-net` and the browser crypto backends, so no new crate is introduced.
jetstream = ["dep:twox-hash", "dep:zstd", "dep:ruzstd", "dep:bytes", "dep:jiff", "dep:futures", "dep:tokio-tungstenite", "dep:gloo-net", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:url", "api"]

# Everything
full = [
    "syntax", "cbor", "crypto", "mst", "repo", "car",
    "lexicon", "xrpc", "xrpc-server", "identity", "streaming",
    "sync", "backfill", "labeling", "oauth", "api", "jetstream",
]

# Browser-safe client functionality. Server, sync, and backfill features are
# intentionally excluded because they require native sockets or threads.
wasm = [
    "syntax", "cbor", "crypto", "mst", "repo", "car", "lexicon",
    "xrpc", "identity", "streaming", "labeling", "oauth", "api", "jetstream",
]

# === Always-on dependencies (used by many modules) ===
[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
data-encoding.workspace = true

# === Feature-gated dependencies ===

# cbor
simdutf8 = { version = "0.1", optional = true }
bumpalo = { version = "3", optional = true }

# crypto
p256 = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }

# xrpc, identity, oauth
reqwest = { workspace = true, optional = true }

# xrpc-server
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# streaming
futures = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# backfill
tokio-util = { workspace = true, optional = true }

# oauth, sync
async-trait = { workspace = true, optional = true }

# jetstream (cross-target): xxh3 segment checksums. No default features keeps
# this off `rand`/`std`-random and portable to wasm32-unknown-unknown.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64", "alloc"], optional = true }
# jetstream (cross-target): reference-counted record backing so archive rows
# share one decompressed slab without `unsafe` or self-referential structs.
bytes = { version = "1", optional = true }
# jetstream (cross-target): exact RFC-3339 <-> Unix-microsecond conversion for
# live timestamps vs archive witnessed time. No default features avoids the
# bundled tzdb and system-clock code; we only parse and format instants.
jiff = { version = "0.2", default-features = false, features = ["std", "perf-inline"], optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
# Native modules use Tokio networking and timers. Keeping these features off the
# browser target is what lets the same high-level clients compile there.
tokio = { workspace = true, optional = true, features = ["full"] }
hickory-resolver = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
# jetstream (native): bounded zstd block/frame decode via libzstd.
zstd = { version = "0.14", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "sync", "macros", "io-util"] }
# jetstream (wasm): `websocket` powers the live tail; `http` powers the archive
# `fetch` transport. Both draw only on `web-sys` bindings already in the tree.
gloo-net = { version = "0.6", features = ["websocket", "http"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { workspace = true, optional = true }
# jetstream (wasm): the browser archive transport streams the `fetch` response
# body incrementally through a `ReadableStream` reader, so `read_body_bounded`
# enforces the caller's exact per-request byte cap chunk-by-chunk (matching the
# native `reqwest` path) instead of buffering a whole response first. These
# crates are already resolved via `gloo-net`; pinned to the workspace versions.
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { version = "=0.3.104", optional = true, features = ["ReadableStream", "ReadableStreamDefaultReader", "RequestRedirect", "RequestMode", "RequestCredentials"] }
# Shrike currently reaches both getrandom 0.2 (elliptic-curve) and 0.3 (rand).
# Opt both generations into their browser crypto backends.
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
# jetstream (wasm): pure-Rust zstd decoder for the browser target, where the
# libzstd C build is unavailable. Decode-only; must agree byte-for-byte with the
# native `zstd` path on the shared golden corpus.
ruzstd = { version = "0.9", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
axum = { workspace = true }
reqwest = { workspace = true }
tower = "0.5"
http-body-util = "0.1"
serde_json.workspace = true
url.workspace = true
sha2.workspace = true
data-encoding.workspace = true

[[test]]
name = "api_cbor_roundtrip"
required-features = ["api"]

[[test]]
name = "crypto_interop"
required-features = ["crypto"]

[[test]]
name = "cbor_interop"
required-features = ["cbor"]

[[test]]
name = "repo_car_interop"
required-features = ["repo", "car", "mst"]

[[test]]
name = "oauth_integration"
required-features = ["oauth"]

[[test]]
name = "identity_integration"
required-features = ["identity"]

[[test]]
name = "sync_1_1_parser"
required-features = ["sync", "streaming"]

[[test]]
name = "sync_1_1_streaming"
required-features = ["sync", "streaming", "identity"]

[[test]]
name = "sync_1_1_verifier"
required-features = ["sync", "identity"]

[[test]]
name = "jetstream_property_tests"
required-features = ["jetstream"]

[[bench]]
name = "cbor_benchmarks"
harness = false
required-features = ["cbor"]

[[example]]
name = "jetstream_bench"
required-features = ["jetstream"]

[[bench]]
name = "mst_benchmarks"
harness = false
required-features = ["mst"]

[[bench]]
name = "car_benchmarks"
harness = false
required-features = ["car"]

[[bench]]
name = "repo_benchmarks"
harness = false
required-features = ["repo"]
