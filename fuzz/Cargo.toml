[package]
name = "shrike-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone crate — not part of the shrike workspace (cargo-fuzz convention).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bumpalo = "3"
# The pure-Rust oracle for `k256_backends_differential` (already in the tree).
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = { version = "0.11", default-features = false }

[dependencies.shrike]
path = ".."
features = [
    "syntax", "cbor", "mst", "car", "repo", "crypto",
    "lexicon", "streaming", "sync", "labeling", "jetstream",
    "service-auth", "xrpc-server", "oauth", "secp256k1",
]

# Seed-corpus generator (a normal binary, not a fuzz target).
[[bin]]
name = "gen_seeds"
path = "src/bin/gen_seeds.rs"
test = false
doc = false
bench = false

