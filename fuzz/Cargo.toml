[package]
name = "shrike-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone crate — not part of the shrike workspace (cargo-fuzz convention).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
bumpalo = "3"

[dependencies.shrike]
path = ".."
features = [
    "syntax", "cbor", "mst", "car", "repo", "crypto",
    "lexicon", "streaming", "sync", "labeling", "jetstream",
]

# Seed-corpus generator (a normal binary, not a fuzz target).
[[bin]]
name = "gen_seeds"
path = "src/bin/gen_seeds.rs"
test = false
doc = false
bench = false

